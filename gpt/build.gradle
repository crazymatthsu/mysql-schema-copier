plugins {
    id "application"
}

group = "com.example"
version = "0.1.0"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = "com.example.mssqllocal.Main"
}

tasks.register("selfTest", JavaExec) {
    group = "verification"
    description = "Runs dependency-free Java self tests for the local MSSQL tool."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.example.mssqllocal.SelfTest"
}

tasks.named("test") {
    enabled = false
}

tasks.named("check") {
    dependsOn("selfTest")
}

tasks.register("localEnv", JavaExec) {
    group = "local development"
    description = "Runs the local SQL Server environment tool. Example: gradle localEnv --args='reset'"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
}
